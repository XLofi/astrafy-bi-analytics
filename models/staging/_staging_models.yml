version: 2

models:
  - name: stg_orders
    description: >
      Cleaned and standardized order-level data. The expected grain is
      one row per order.

    columns:
      - name: order_id
        description: Unique identifier of an order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null

      - name: order_date
        description: Date on which the order was placed.
        data_tests:
          - not_null

      - name: order_net_sales
        description: Net sales amount associated with the order.
        data_tests:
          - not_null

  - name: stg_sales
    description: >
      Cleaned and standardized product sales-line data. The expected grain
      is one row per order and product.

    columns:
      - name: order_id
        description: Identifier of the order associated with the sales line.
        data_tests:
          - not_null
        
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
              config:
                severity: error
                warn_if: "> 0"
                error_if: "> 1"

      - name: customer_id
        description: Identifier of the customer associated with the order.
        data_tests:
          - not_null

      - name: order_date
        description: Date on which the order was placed.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the product included in the order.
        data_tests:
          - not_null

      - name: line_net_sales
        description: Net sales amount associated with the product line.
        data_tests:
          - not_null

      - name: product_quantity
        description: Number of units sold for the product line.
        data_tests:
          - not_null
