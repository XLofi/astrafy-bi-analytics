version: 2

models:
  - name: int_order_product_metrics
    description: >
      Order-level product and revenue metrics calculated from valid sales
      lines. The model contains one row per order present in stg_orders.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique

          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: qty_product
        description: Total quantity of product units included in the order.
        data_tests:
          - not_null

      - name: distinct_product_count
        description: Number of distinct products included in the order.
        data_tests:
          - not_null

      - name: product_line_count
        description: Number of product-level sales lines associated with the order.
        data_tests:
          - not_null

      - name: calculated_order_net_sales
        description: Order revenue reconstructed by summing its sales lines.
        data_tests:
          - not_null

  - name: int_orders_enriched
    description: >
      Canonical order-level intermediate model enriched with product
      quantities, product counts, and reconstructed sales revenue.
      The grain is one row per order.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null

      - name: order_date
        description: Date on which the order was placed.
        data_tests:
          - not_null

      - name: order_net_sales
        description: Net sales amount from the order source.
        data_tests:
          - not_null

      - name: qty_product
        description: Total number of product units included in the order.
        data_tests:
          - not_null

      - name: distinct_product_count
        description: Number of distinct products included in the order.
        data_tests:
          - not_null

      - name: revenue_difference
        description: >
          Difference between order-level revenue and revenue reconstructed
          from product sales lines.
        data_tests:
          - not_null

  - name: int_order_rolling_history
    description: >
      Order-level model containing the number of orders placed by the
      customer during the preceding 12 months. Orders placed on the same
      calendar date are not treated as prior orders because the supplied
      data does not include order timestamps.

    columns:
      - name: order_id
        description: Unique identifier of the current order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null

      - name: order_date
        description: Date on which the current order was placed.
        data_tests:
          - not_null

      - name: prior_orders_12m
        description: >
          Number of orders placed by the customer on earlier dates during
          the 12 months preceding the current order.
        data_tests:
          - not_null

      - name: has_complete_12_month_history
        description: >
          Indicates whether the available source data covers the full
          12-month period preceding the order.
        data_tests:
          - not_null

  - name: int_orders_segmented
    description: >
      Order-level model containing the customer order segment calculated
      from the number of orders placed during the preceding 12 months.
      Orders placed on the same calendar date are not counted as prior
      orders because the source does not contain timestamps.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null
          - unique

      - name: prior_orders_12m
        description: >
          Number of orders placed by the customer on earlier calendar
          dates during the preceding 12 months.
        data_tests:
          - not_null

      - name: order_segmentation
        description: >
          New when there are no prior orders, Returning when there are
          between one and three, and VIP when there are four or more.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - New
                  - Returning
                  - VIP

      - name: has_complete_12_month_history
        description: >
          Indicates whether the supplied source covers the complete
          12-month period preceding the order.
        data_tests:
          - not_null
